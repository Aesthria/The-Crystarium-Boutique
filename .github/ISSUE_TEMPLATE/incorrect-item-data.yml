name: Incorrect Item / Acquisition Data
description: Report a wrong, missing, or misleading item, model, availability, or acquisition relationship.
title: "[Data] "
labels: [data]
body:
  - type: markdown
    attributes:
      value: Provide exact Item IDs and reputable evidence. Missing acquisition information alone does not prove that an item is unobtainable.
  - type: input
    id: version
    attributes:
      label: Boutique version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Item name and Item ID
      placeholder: Example Hat — Item ID 12345
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Data area
      options:
        - Missing or incorrect acquisition source
        - Incorrect duty, difficulty, tier, or boss
        - Incorrect availability or exclusion
        - Incorrect shared-model relationship
        - Incorrect equipment, dye, or variant metadata
        - Other item data
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What TCB currently shows
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Correct result and evidence
      description: Link to a reputable source and explain whether this is a direct drop, chest, token exchange, quest, craft, vendor purchase, or another relationship.
    validations:
      required: true
  - type: input
    id: duty_ids
    attributes:
      label: Relevant stable IDs, if known
      description: ContentFinderCondition, TerritoryType, Treasure/chest, Map, or other stable IDs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed character/account data, tokens, private paths, chat, and unrelated plugin information.
          required: true
