name: Private Beta Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build private beta artifact
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DALAMUD_BUNDLE_URL: https://goatcorp.github.io/dalamud-distrib/latest.zip
      DALAMUD_BUNDLE_SHA256: 94F3E4050237B4B9D85AD55CA3CACB8547F337745FB28A4A882834F148A217BE
      DALAMUD_ASSEMBLY_VERSION: 15.0.3.2
      DOTNET_CLI_HOME: ${{ runner.temp }}\dotnet-home
      NUGET_PACKAGES: ${{ runner.temp }}\nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out reviewed source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select .NET 10 SDK
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400

      - name: Download and verify pinned Dalamud build dependencies
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'dalamud-api15.zip'
          $dalamudHome = Join-Path $env:RUNNER_TEMP 'dalamud-api15'
          Invoke-WebRequest -UseBasicParsing -Uri $env:DALAMUD_BUNDLE_URL -OutFile $archivePath

          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash
          if ($actualHash -ne $env:DALAMUD_BUNDLE_SHA256) {
            throw "Dalamud bundle SHA-256 '$actualHash' does not match the reviewed hash '$env:DALAMUD_BUNDLE_SHA256'."
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $dalamudHome
          $requiredFiles = @(
            'Dalamud.dll',
            'Dalamud.Bindings.ImGui.dll',
            'Lumina.dll',
            'Lumina.Excel.dll',
            'Serilog.dll',
            'BCnEncoder.dll',
            'CommunityToolkit.HighPerformance.dll',
            'Microsoft.Extensions.ObjectPool.dll'
          )
          $missingFiles = @(
            $requiredFiles |
              Where-Object { -not (Test-Path -LiteralPath (Join-Path $dalamudHome $_) -PathType Leaf) }
          )
          if ($missingFiles.Count -gt 0) {
            throw "The pinned Dalamud bundle is missing required files: $($missingFiles -join ', ')."
          }

          $actualDalamudVersion = [Reflection.AssemblyName]::GetAssemblyName(
            (Join-Path $dalamudHome 'Dalamud.dll')).Version.ToString()
          if ($actualDalamudVersion -ne $env:DALAMUD_ASSEMBLY_VERSION) {
            throw "Dalamud assembly version '$actualDalamudVersion' does not match '$env:DALAMUD_ASSEMBLY_VERSION'."
          }

          "DALAMUD_HOME=$dalamudHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\CrystariumBoutique.sln --locked-mode

      - name: Build, inspect runtime dependencies, and run all tests
        shell: pwsh
        run: .\scripts\Build.ps1 -Configuration Release -NoRestore -SkipStage

      - name: Create allowlisted private beta package
        id: package
        shell: pwsh
        run: .\scripts\Package-PrivateBeta.ps1 -NoRestore -SkipBuildAndTests

      - name: Verify deterministic package generation
        shell: pwsh
        run: |
          $packagePath = '${{ steps.package.outputs.package_path }}'
          $firstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagePath).Hash
          .\scripts\Package-PrivateBeta.ps1 -NoRestore -SkipBuildAndTests
          $secondHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagePath).Hash
          if ($firstHash -ne $secondHash) {
            throw "Private-beta package is not deterministic: '$firstHash' != '$secondHash'."
          }
          Write-Output "Deterministic package SHA-256: $secondHash"

      - name: Inspect and validate package
        shell: pwsh
        run: >-
          .\scripts\Test-PrivateBetaPackage.ps1
          -PackagePath '${{ steps.package.outputs.package_path }}'
          -ExpectedVersion '${{ steps.package.outputs.version }}'

      - name: Upload authenticated private artifact
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
