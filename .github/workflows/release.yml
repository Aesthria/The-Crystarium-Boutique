name: Release Infrastructure

on:
  workflow_dispatch:
    inputs:
      version:
        description: Synthetic release version for a non-publishing dry run
        required: true
        default: 0.1.0-rc.0
        type: string
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DALAMUD_BUNDLE_URL: https://goatcorp.github.io/dalamud-distrib/latest.zip
  DALAMUD_BUNDLE_SHA256: 2343AB848DEF4F749A8B7ECF9A139E82F38801A8F631F6B55CAF748C768AAB4C
  DALAMUD_ASSEMBLY_VERSION: 15.0.3.4
  DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-cli-home
  NUGET_PACKAGES: ${{ github.workspace }}\.packages
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    name: Validate release without publishing
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select .NET 10 SDK
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400

      - name: Download and verify pinned Dalamud build dependencies
        shell: pwsh
        run: .\.github\workflows\scripts\install-dalamud.ps1

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\CrystariumBoutique.sln --locked-mode

      - name: Execute non-publishing release dry run
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          .\scripts\Invoke-ReleaseDryRun.ps1
          -Version $env:RELEASE_VERSION
          -NoRestore
          -RepoOutputPath .\artifacts\release-dry-run\repo.json

      - name: Upload private workflow evidence
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dry-run-${{ inputs.version }}
          path: |
            artifacts/release-dry-run/CrystariumBoutique-${{ inputs.version }}.zip
            artifacts/release-dry-run/repo.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build an explicitly tagged release
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select .NET 10 SDK
        # actions/setup-dotnet v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400

      - name: Download and verify pinned Dalamud build dependencies
        shell: pwsh
        run: .\.github\workflows\scripts\install-dalamud.ps1

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore .\CrystariumBoutique.sln --locked-mode

      - name: Build and validate tagged release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Publishing tags must use stable vMAJOR.MINOR.PATCH syntax: '$env:GITHUB_REF_NAME'."
          }
          $committedEntries = @(Get-Content -Raw -LiteralPath .\repo.json | ConvertFrom-Json)
          if ($committedEntries.Count -ne 1 -or
              [string]::IsNullOrWhiteSpace([string]$committedEntries[0].Changelog)) {
            throw 'Committed repo.json must contain exactly one entry with a reviewed changelog.'
          }
          .\scripts\Invoke-ReleaseDryRun.ps1 `
            -Version $version `
            -NoRestore `
            -RepoOutputPath .\artifacts\release\repo.json `
            -Changelog $committedEntries[0].Changelog

          $committedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath .\repo.json).Hash
          $generatedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath .\artifacts\release\repo.json).Hash
          if ($committedHash -ne $generatedHash) {
            throw 'Committed repo.json does not match the tagged release metadata.'
          }

      - name: Create GitHub Release and upload the validated ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $package = ".\artifacts\release\CrystariumBoutique-$version.zip"
          gh release create $env:GITHUB_REF_NAME $package `
            --verify-tag `
            --title "The Crystarium Boutique $version" `
            --generate-notes
